# Prefix: Ctrl-S, like GNU Screen
unbind C-b
set -g prefix C-s
bind-key C-s send-prefix

# Splits
bind-key | split-window -h
bind-key - split-window -v
unbind '"'
unbind %

# Panic sheet
bind-key H run-shell "$HOME/.local/bin/x_tmux_panic"

# Pane switching without prefix
bind-key -n C-Left select-pane -L
bind-key -n C-Right select-pane -R
bind-key -n C-Up select-pane -U
bind-key -n C-Down select-pane -D

# Status position
set-option -g status-position top

# Mouse support
set -g mouse on

# Reload config
bind-key r source-file ~/.tmux.conf \; display-message "Reloaded!"

# Vi mode
setw -g mode-keys vi

# Colours
set -g default-terminal "screen-256color"

# Status bar basics
set -g status-interval 5
set -g status-left-length 60
set -g status-right-length 120

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'catppuccin/tmux'

# tmux-resurrect
set -g @resurrect-dir "$HOME/.tmux/resurrect"
bind-key F2 run-shell "$HOME/.tmux/plugins/tmux-resurrect/scripts/save.sh"
bind-key F3 run-shell "$HOME/.tmux/plugins/tmux-resurrect/scripts/restore.sh"

# Catppuccin
set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_status_modules_right "directory user host session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{pane_current_path}"

# Load TPM last
run-shell "$HOME/.tmux/plugins/tpm/tpm"
